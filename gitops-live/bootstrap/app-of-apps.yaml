apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aws-gitops-platform-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/idan5353/GitOpsLive-Project.git
    targetRevision: main
    path: apps/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true