apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aws-gitops-platform-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/YOUR_USERNAME/gitops-live.git
    targetRevision: HEAD
    path: charts
  directory:
    recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true