apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: dev
  labels:
    app: backend
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: aws-gitops-platform
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP